name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      # Publish only the live pages and what they load. Everything else
      # (design/, README.md, workflow files) stays in the repo only.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html favicon.ico favicon.svg CNAME _site/
          cp -r img preview _site/
      # Stamp the footer with the date the site content last changed.
      - name: Add last updated date
        run: |
          ISO=$(git log -1 --format=%cs -- preview img index.html)
          NICE=$(date -d "$ISO" "+%-d %B %Y")
          sed -i "s/__UPDATED_ISO__/$ISO/; s/__UPDATED__/$NICE/" _site/preview/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
